name: CI/CD

# Every push and pull request is checked: types, unit tests, the production build, browser tests against the
# built app, the docs' diagrams and a dependency audit. A push to main that passes all of it deploys to
# Cloudflare, smoke-tests production, and rolls back automatically if the smoke test fails.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://tarang-fm.dualmindlab.tech' }}

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Build
        run: npx vite build
      - name: Bundle size
        run: |
          {
            echo '### Bundle'
            echo '| File | Size |'
            echo '|---|---|'
            find dist -type f \( -name '*.js' -o -name '*.css' \) -not -name '*.map' -printf '| %P | %k KB |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 14

  e2e:
    name: Browser tests (desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npx vite build
      # Playwright starts and stops its own preview server, so it runs before anything else holds the port
      - name: Playwright
        run: npm run test:e2e
      - name: Smoke test the built app locally
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 --timeout 60000 http-get://localhost:4173/api/health
          node scripts/smoke.mjs http://localhost:4173 --allow-missing-key
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  diagrams:
    name: Docs diagrams render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.4.2
      - name: Render every diagram
        run: |
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          node scripts/check-diagrams.mjs mmdc "$RUNNER_TEMP/puppeteer.json"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e, diagrams, audit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy from CI."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Build and deploy
        if: steps.creds.outputs.ready == 'true'
        run: npm run deploy -- --message "CI deploy of ${GITHUB_SHA::7}"
      - name: Smoke test production
        id: smoke
        if: steps.creds.outputs.ready == 'true'
        run: node scripts/smoke.mjs "$PRODUCTION_URL"
      - name: Roll back on a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --name tarang-fm --message "Smoke test failed for ${GITHUB_SHA::7}" --yes
      - name: Summary
        if: always() && steps.creds.outputs.ready == 'true'
        run: |
          {
            echo '### Deploy'
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- URL: $PRODUCTION_URL"
            echo "- Smoke test: ${{ steps.smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
