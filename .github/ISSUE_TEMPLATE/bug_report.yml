name: Bug report
description: Something sounded, looked or behaved wrong
labels: [bug]
body:
  - type: input
    id: where
    attributes: {label: Page and station, placeholder: "/listen, Hindi 91.1"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: What you saw or heard, and what you expected}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Browser and device, placeholder: "Safari on iPhone 15"}
  - type: textarea
    id: extra
    attributes: {label: Screenshot or console output, description: "Do not paste secrets."}
